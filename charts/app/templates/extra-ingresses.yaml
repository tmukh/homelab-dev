{{- range .Values.extraIngresses }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels: {{- include "app.labels" $ | nindent 4 }}
spec:
  ingressClassName: {{ .className }}
  rules:
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ $.Release.Name }}, port: {number: 80}}
{{- end }}
