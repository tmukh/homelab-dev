apiVersion: batch/v1
kind: CronJob
metadata:
  name: tracker-backup
spec:
  schedule: "30 3 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: application-tracker
              args: ["python", "-m", "tracker", "backup", "/data/backups"]
              envFrom:
                - configMapRef:
                    name: tracker-config
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tracker-data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tracker-data
              persistentVolumeClaim:
                claimName: tracker-data
            - name: tmp
              emptyDir: {}
