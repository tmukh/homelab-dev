apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-lab-web
  namespace: kube-lab
  labels:
    app: kube-lab-http
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-lab-http
  template:
    metadata:
      labels:
        app: kube-lab-http
    spec:
      containers:
        - name: kube-lab-web
          image: ghcr.io/tmukh/kube-lab-web:sha-dac0da6
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
