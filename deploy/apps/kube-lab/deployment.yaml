apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-lab-web
  namespace: kube-lab
  labels:
    app: kube-lab-http
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-lab-http        # immutable after creation: do not change
  template:
    metadata:
      labels:
        app: kube-lab-http      # must include everything in the selector
    spec:
      containers:
        - name: kube-lab-web
          image: ghcr.io/tmukh/kube-lab-web:sha-dac0da6
          ports:
            - name: http
              containerPort: 80     # official nginx listens on 80
          resources:
            requests:               # what the scheduler reserves
              cpu: 10m
              memory: 16Mi
            limits:                 # ceiling: memory overuse = OOMKilled
              cpu: 100m
              memory: 64Mi
          readinessProbe:           # gates traffic and rollout progress
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:            # failure restarts the container
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
