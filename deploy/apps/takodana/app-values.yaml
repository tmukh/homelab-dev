# takodana.dev (portfolio + writing) on the shared app chart (charts/app).
# A static Next.js export served by nginx-unprivileged; it writes only its pid and temp files, under /tmp.
# sha-46c8011 (glasswing lab and write-up); signature verified with cosign against the repo's main workflow
image: ghcr.io/tmukh/takodana.dev@sha256:7a1e9ed45149cc6f48d976c501dce08dc032d9a226dc05ac22f2b8d046736b70
port: 8080

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}

networkPolicy:
  # tailscale: the tailnet preview; kube-system: Traefik (public route)
  allowFromNamespaces: [tailscale, kube-system]

# Tailnet: https://takodana.tailadc3fe.ts.net
ingress:
  enabled: true
  className: tailscale
  host: takodana

# Public: https://takodana.dev (Cloudflare Tunnel -> Traefik -> this Ingress)
extraIngresses:
  - name: public
    className: traefik
    host: takodana.dev
