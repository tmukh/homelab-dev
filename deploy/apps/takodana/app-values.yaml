# takodana.dev (portfolio + writing) on the shared app chart (charts/app).
# A static Next.js export served by nginx-unprivileged; it writes only its pid and temp files, under /tmp.
# sha-cafc292 (glasswing explained, part 4); signature verified with cosign against the repo's main workflow
image: ghcr.io/tmukh/takodana.dev@sha256:a214e5635ae21f513cb2f9cc2e0d7815f240b1f21dce5a135f3cda80b2d4ce07
port: 8080

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}

networkPolicy:
  # tailscale: the tailnet preview; kube-system: Traefik (public route)
  allowFromNamespaces: [tailscale, kube-system]

# Tailnet: https://takodana.tailadc3fe.ts.net
ingress:
  enabled: true
  className: tailscale
  host: takodana

# Public: https://takodana.dev (Cloudflare Tunnel -> Traefik -> this Ingress)
extraIngresses:
  - name: public
    className: traefik
    host: takodana.dev
