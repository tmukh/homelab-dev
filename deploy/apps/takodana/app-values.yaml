# takodana.dev (portfolio + writing) on the shared app chart (charts/app).
# A static Next.js export served by nginx-unprivileged; it writes only its pid and temp files, under /tmp.
# sha-091979d (glasswing explained, part 2); signature verified with cosign against the repo's main workflow
image: ghcr.io/tmukh/takodana.dev@sha256:e893a1726f6626c11108e3a25fda1b11d5971ab0d399d6a02295396f7cd6816b
port: 8080

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}

networkPolicy:
  # tailscale: the tailnet preview; kube-system: Traefik (public route)
  allowFromNamespaces: [tailscale, kube-system]

# Tailnet: https://takodana.tailadc3fe.ts.net
ingress:
  enabled: true
  className: tailscale
  host: takodana

# Public: https://takodana.dev (Cloudflare Tunnel -> Traefik -> this Ingress)
extraIngresses:
  - name: public
    className: traefik
    host: takodana.dev
