# takodana.dev (portfolio + writing) on the shared app chart (charts/app).
# A static Next.js export served by nginx-unprivileged; it writes only its pid and temp files, under /tmp.
# sha-985ddb6 (glasswing explained, part 3); signature verified with cosign against the repo's main workflow
image: ghcr.io/tmukh/takodana.dev@sha256:ab40422dd23afb9bdd327d561ad14152f0facc454f1815d0d38f4365f6ed7ed8
port: 8080

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}

networkPolicy:
  # tailscale: the tailnet preview; kube-system: Traefik (public route)
  allowFromNamespaces: [tailscale, kube-system]

# Tailnet: https://takodana.tailadc3fe.ts.net
ingress:
  enabled: true
  className: tailscale
  host: takodana

# Public: https://takodana.dev (Cloudflare Tunnel -> Traefik -> this Ingress)
extraIngresses:
  - name: public
    className: traefik
    host: takodana.dev
