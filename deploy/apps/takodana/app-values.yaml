# takodana.dev (portfolio + writing) on the shared app chart (charts/app).
# A static Next.js export served by nginx-unprivileged; it writes only its pid and temp files, under /tmp.
# sha-6f677e2 (glasswing explained, part 6); signature verified with cosign against the repo's main workflow
image: ghcr.io/tmukh/takodana.dev@sha256:ff3a4d7cab5b8f6db9db0fd3f5ae0cbfc14af22473bf92f968372fafa729ad26
port: 8080

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}

networkPolicy:
  # tailscale: the tailnet preview; kube-system: Traefik (public route)
  allowFromNamespaces: [tailscale, kube-system]

# Tailnet: https://takodana.tailadc3fe.ts.net
ingress:
  enabled: true
  className: tailscale
  host: takodana

# Public: https://takodana.dev (Cloudflare Tunnel -> Traefik -> this Ingress)
extraIngresses:
  - name: public
    className: traefik
    host: takodana.dev
