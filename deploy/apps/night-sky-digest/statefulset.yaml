apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: night-sky-postgres
  labels:
    app: night-sky-postgres
spec:
  serviceName: night-sky-postgres
  replicas: 1
  selector:
    matchLabels:
      app: night-sky-postgres
  template:
    metadata:
      labels:
        app: night-sky-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - name: POSTGRES_USER
              value: night_sky
            - name: POSTGRES_DB
              value: night_sky
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: night-sky-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "night_sky", "-d", "night_sky"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "night_sky", "-d", "night_sky"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql
            - name: postgres-tmp
              mountPath: /tmp
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: night-sky-postgres-data
        - name: postgres-run
          emptyDir: {}
        - name: postgres-tmp
          emptyDir: {}
