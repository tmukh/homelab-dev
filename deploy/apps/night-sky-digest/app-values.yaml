# night-sky-digest on the shared app chart (charts/app).
# sha-aa1c5aa (website); signature verified with cosign against the repo's main workflow
image: ghcr.io/tmukh/night-sky-digest@sha256:1d87c6ce396e0f516a7f202352e57bd48020291261143a983b53ff24ea3c7ee1

env:
  - name: DATABASE_URL  # written by CloudNativePG for the night_sky owner
    valueFrom: {secretKeyRef: {name: night-sky-db-app, key: uri}}
  - name: OLLAMA_URL    # Windows PC's GPU over the tailnet (ADR 0002), see ollama-egress.yaml
    value: http://ollama:11434
  - name: LANGFUSE_BASE_URL
    value: http://langfuse-web.langfuse.svc:3000
  - name: LANGFUSE_PUBLIC_KEY
    valueFrom: {secretKeyRef: {name: night-sky-langfuse, key: public-key}}
  - name: LANGFUSE_SECRET_KEY
    valueFrom: {secretKeyRef: {name: night-sky-langfuse, key: secret-key}}
  - name: HOME
    value: /tmp
  # First announcement day the nightly pipeline is responsible for (digest due 2026-10-13 07:00).
  - name: NIGHT_SKY_SLO_START
    value: "2026-10-12"

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}

initContainers:
  - name: migrate
    command: [python, -m, night_sky_digest, migrate]

# Europe/Berlin. Ingest after the 01:00 backup; arXiv announces around 02:00 CET.
cronJobs:
  - name: ingest
    schedule: "0 2 * * *"
    command: [python, -m, night_sky_digest, ingest]
  - name: embed
    schedule: "30 2 * * *"
    command: [python, -m, night_sky_digest, embed]
    activeDeadlineSeconds: 7200
  - name: digest
    schedule: "0 6 * * *"
    command: [python, -m, night_sky_digest, digest]

networkPolicy:
  # tailscale: dev access; kube-system: Traefik (public route); monitoring: Prometheus scrapes /metrics
  allowFromNamespaces: [tailscale, kube-system, monitoring]

# Tailnet: https://night-sky.tailadc3fe.ts.net
ingress:
  enabled: true
  className: tailscale
  host: night-sky

# Public: https://digest.takodana.dev (Cloudflare Tunnel -> Traefik -> this Ingress)
extraIngresses:
  - name: public
    className: traefik
    host: digest.takodana.dev

serviceMonitor:
  enabled: true
