apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: night-sky-postgres
spec:
  podSelector:
    matchLabels:
      app: night-sky-postgres
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}          # night-sky workloads (ingest, api, digest)
        - namespaceSelector:       # Tailscale proxy, for dev access over the tailnet
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
