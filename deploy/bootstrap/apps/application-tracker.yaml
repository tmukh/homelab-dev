apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-tracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tmukh/homelab-dev.git
    targetRevision: main
    path: deploy/apps/application-tracker
  destination:
    server: https://kubernetes.default.svc
    namespace: application-tracker
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: application-tracker
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
