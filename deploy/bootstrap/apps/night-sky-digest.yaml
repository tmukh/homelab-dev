apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: night-sky-digest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tmukh/homelab-dev.git
    targetRevision: main
    path: deploy/apps/night-sky-digest
  destination:
    server: https://kubernetes.default.svc
    namespace: night-sky
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    # The Cluster/ObjectStore kinds only exist once the CNPG apps have synced.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
