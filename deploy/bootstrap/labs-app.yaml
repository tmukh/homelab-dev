apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: labs
  namespace: argocd
spec:
  destination:
    namespace: labs
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/tmukh/homelab-dev.git
    path: labs/break-it
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
