# Single SeaweedFS pod (master + volume + filer + S3 gateway). Bucket "postgres" for CNPG backups.
# Credentials: the IAM config lives in the SealedSecret backup-store-s3 (manifests/).
master:
  enabled: false
volume:
  enabled: false
filer:
  enabled: false
allInOne:
  enabled: true
  s3:
    enabled: true
    enableAuth: true
    existingConfigSecret: backup-store-s3
    createBuckets:
      - name: postgres
  data:
    type: persistentVolumeClaim
    size: 20Gi
  # 512 Mi was too little: the nightly base backup (multipart upload, ~300 MB of tables and
  # embeddings) killed the pod mid-upload ("Could not connect to the endpoint URL ... partNumber=19").
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1536Mi}
