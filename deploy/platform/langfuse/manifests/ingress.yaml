# Tailnet only: https://langfuse.tailadc3fe.ts.net (same pattern as application-tracker).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: langfuse-web
      port:
        number: 3000
  tls:
    - hosts:
        - langfuse
