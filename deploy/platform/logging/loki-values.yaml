# Loki 7.3.0 in single-binary mode: one pod, filesystem storage, 7 days of logs.
deploymentMode: SingleBinary
loki:
  auth_enabled: false  # single tenant; only reachable inside the cluster
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  persistence:
    size: 10Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 768Mi}
# Scalable-mode components off.
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
