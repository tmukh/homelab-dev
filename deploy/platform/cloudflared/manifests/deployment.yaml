# cloudflared opens outbound connections to Cloudflare; no ports are opened on the router.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels: {app: cloudflared}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cloudflared}
  template:
    metadata:
      labels: {app: cloudflared}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
          args: [tunnel, --config, /etc/cloudflared/config/config.yaml, run]
          ports:
            - {name: metrics, containerPort: 2000}
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/cloudflared/config, readOnly: true}
            - {name: creds, mountPath: /etc/cloudflared/creds, readOnly: true}
      volumes:
        - name: config
          configMap: {name: cloudflared-config}
        - name: creds
          secret: {secretName: tunnel-credentials}
